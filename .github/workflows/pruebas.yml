name: Pruebas

# Solo pruebas: no toca la red ni reconstruye nada. Usa el panel versionado.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias de la app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Pruebas
        run: pytest tests/ -q
      - name: La app arranca
        run: |
          python -c "import streamlit_app; print('modulo de la app importable')"
